name: CI

# Runs everything the local machine cannot: the ASGI test suites need an asyncio
# event loop, and on Windows asyncio builds its self-pipe from socket.socketpair()
# (a loopback connection). On the development host loopback connections to a
# listening socket are dropped, so uvicorn and Starlette's TestClient cannot run
# there at all. Linux runners use AF_UNIX for that self-pipe, so the full suite
# runs here.
#
# Everything is public-safe: no credentials, no secrets, no external services.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Tasks A/B and the API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/backend/requirements-dev.txt

      - name: Task A - inventory reservation ledger
        run: python -m pytest A/tests -q

      - name: Task B - fulfilment split optimiser
        run: python -m pytest B/tests -q

      - name: App backend - API, idempotency, concurrency, contract
        # Run each module separately so a failure names itself, and surface the
        # first failure as a check-run annotation: annotations are readable
        # without a token, job logs are not.
        run: |
          set +e
          overall=0
          reported=0
          for module in test_store test_endpoints test_contract test_catalog test_cart test_idempotency test_concurrency test_live_server; do
            echo "::group::$module"
            python -m pytest "app/backend/tests/$module.py" -q --tb=short > "/tmp/$module.log" 2>&1
            code=$?
            tail -n 30 "/tmp/$module.log"
            if [ "$code" -ne 0 ]; then
              overall=1
              echo "::error::$module failed (exit $code)"
              if [ "$reported" -eq 0 ]; then
                reported=1
                grep -E '^(FAILED|ERROR)|^E   ' "/tmp/$module.log" | head -n 8 | while IFS= read -r line; do
                  echo "::error::$line"
                done
              fi
            fi
            echo "::endgroup::"
          done
          exit $overall

      - name: Documented CLI examples still match the statement
        run: |
          diff <(python A/ledger.py --input A/tests/sample_input.txt) A/tests/sample_output.txt
          diff <(python B/optimiser.py --input B/tests/sample_input.txt) B/tests/sample_output.txt

  frontend:
    name: Variant PDP frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image is built with the same Dockerfile a reviewer would use, then
      # exercised over HTTP: the SPA sold from the same origin as the API, and
      # an idempotent cart write.
      - name: Build the image
        run: docker build --tag variant-pdp:ci .

      - name: Start the container and wait for it to be healthy
        run: |
          docker run --detach --name pdp --publish 8000:8000 variant-pdp:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /dev/null; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "the container never became healthy" >&2
          docker logs pdp
          exit 1

      - name: Smoke-test the API and the SPA served by the image
        run: |
          set -eux
          curl --fail --silent http://127.0.0.1:8000/api/health
          curl --fail --silent http://127.0.0.1:8000/ | grep -q 'id="root"'
          curl --fail --silent http://127.0.0.1:8000/api/products/aurora-trail-runner | head -c 120; echo
          first=$(curl --fail --silent --request POST http://127.0.0.1:8000/api/cart/items \
            --header 'Content-Type: application/json' --header 'Idempotency-Key: ci-container' \
            --data '{"sku_id":"EMB-38","quantity":1}')
          second=$(curl --fail --silent --request POST http://127.0.0.1:8000/api/cart/items \
            --header 'Content-Type: application/json' --header 'Idempotency-Key: ci-container' \
            --data '{"sku_id":"EMB-38","quantity":1}')
          test "$first" = "$second"
          echo "idempotent replay verified"

      - name: Container logs on failure
        if: failure()
        run: docker logs pdp || true

      - name: Stop the container
        if: always()
        run: docker rm --force pdp || true

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      # The browser talks to a real uvicorn process, so the API needs its
      # dependencies here too.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r app/backend/requirements-dev.txt
        working-directory: .

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # `pnpm build` then Playwright; the config starts uvicorn and `vite
      # preview` itself (see playwright.config.ts). The JSON report is turned
      # into check-run annotations so failures are readable without a token.
      - name: Run the browser tests against a real server
        run: |
          set +e
          pnpm build
          PLAYWRIGHT_JSON_OUTPUT_NAME=/tmp/e2e.json pnpm exec playwright test --reporter=list --reporter=json > /tmp/e2e.log 2>&1
          code=$?
          sed -r 's/\x1B\[[0-9;]*[mGK]//g' /tmp/e2e.log | tail -n 40
          if [ "$code" -ne 0 ]; then
            echo "::error::browser e2e failed (exit $code)"
            python ../../.github/scripts/annotate_playwright.py /tmp/e2e.json
            # Both the start and the end of the log matter: a web server that
            # refuses to start says so near the beginning.
            for range in "1,25" "-12,"; do
              sed -r 's/\x1B\[[0-9;]*[mGK]//g' /tmp/e2e.log | grep -v '^[[:space:]]*$' | sed -n "$range"p | while IFS= read -r line; do
                echo "::error::log: ${line:0:900}"
              done
            done
          fi
          exit $code

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
